<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TP4 · Participantes</title><link rel="stylesheet" href="/styles.css"><script defer src="/common.js"></script><script defer src="/participant.js"></script></head>
<body><main><header><div><small>WEB II · TP4</small><h1>Regalos grupales</h1><p>Proponé productos y votá en tiempo real.</p></div><a href="/pantalla" target="_blank" rel="noopener">Abrir pantalla ↗</a></header>
<section class="panel"><h2>Participante</h2><p id="connection" role="status">Conectando…</p><form id="join-form"><label for="name">Tu nombre</label><div class="form-row"><input id="name" maxlength="30" required placeholder="Ej. Ana"><button id="join" disabled>Ingresar</button></div></form><p id="identity" hidden></p><p id="error" class="error" role="alert" hidden></p></section>
<section id="room" hidden><section class="panel"><h2>Conectados (<span id="count">0</span>)</h2><p id="people">—</p></section>
<section class="panel"><h2>Proponer productos</h2><form id="proposal-form"><label for="ids">IDs del catálogo (hasta 10, separados por coma)</label><div class="form-row"><input id="ids" required placeholder="1, 2, 3"><button id="propose">Agregar</button></div></form><p><a href="https://dummyjson.com/products?limit=0" target="_blank" rel="noopener">Consultar catálogo de DummyJSON</a></p><div id="result" role="status" aria-live="polite"></div></section>
<section class="panel"><h2>Ranking de productos</h2><p class="muted">Cualquier participante puede quitar un producto.</p><div id="ranking" class="ranking"></div></section></section></main></body></html>
